<!DOCTYPE html>
<html lang="en">
<head>
  <!-- PAGE SETUP -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password | SustainHealth</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/change-password.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/auth-visual.jsx" type="text/babel" data-presets="react" defer></script>
</head>
<body data-protected="true" data-auth-page="password">
  <!-- ACCOUNT PAGE SHELL -->
  <main class="account-page">
    <section class="account-card" aria-labelledby="passwordTitle">
      <!-- BRAND AND PAGE TITLE -->
      <div class="account-heading">
        <a class="brand-link" href="tracker.html">
          <span class="brand-mark">SH</span>
          <span>SustainHealth</span>
        </a>
        <p class="eyebrow">Account security</p>
        <h1 id="passwordTitle">Change password</h1>
        <p>
          Update the password used to access the private compliance tracker and candidate records.
        </p>
      </div>

      <div>
        <section id="authVisual" class="auth-visual compact" aria-label="Account security preview"></section>

        <!-- PASSWORD FORM -->
        <form id="passwordForm" class="password-form">
          <label>
            Current password
            <input name="currentPassword" type="password" autocomplete="current-password" placeholder="Current password" required />
          </label>

          <label>
            New password
            <input name="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Minimum 8 characters" required />
          </label>

          <label>
            Confirm new password
            <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat new password" required />
          </label>

          <p id="passwordMessage" class="password-message" hidden></p>

          <div class="form-actions">
            <button class="primary-btn" type="submit">Save Password</button>
            <a class="secondary-link" href="tracker.html">Back to Tracker</a>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
